name: Build development client (Android)

# Runs manually only (`eas workflow:run .eas/workflows/build-development.yml`),
# not on every push — a new native build is only needed when native deps or
# app.json/eas.json config change, not for regular JS/TS edits (those reach
# the installed dev client via Metro's normal reload).

jobs:
  build_android:
    name: Build Android development client
    type: build
    params:
      platform: android
      profile: development
